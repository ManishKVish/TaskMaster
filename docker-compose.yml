version: '3.8'

services:
  taskmaster-api:
    build: .
    container_name: taskmaster-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=taskmaster_jwt_secret_production_key_2026
      - NODE_ENV=production
    volumes:
      - taskmaster_data:/app/data
      - taskmaster_uploads:/app/uploads
    restart: unless-stopped

volumes:
  taskmaster_data:
  taskmaster_uploads:
